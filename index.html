<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Scotland Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        #quiz-box {
            background: white;
            padding: 20px;
            max-width: 500px;
            border-radius: 8px;
        }
        button {
            margin-top: 10px;
            display: block;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Scotland Quiz</h1>

    <div id="quiz-box">
        <p id="question"></p>
        <div id="answers"></div>
        <p id="result"></p>
        <p id="score"></p>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
